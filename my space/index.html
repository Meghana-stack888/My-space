
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>

    <div class="container">

        <div class="left">

            <h1>Welcome to My Space</h1>

            <p class="tagline">
                Your cozy corner to write, feel and grow. ✨
            </p>

            <img src="images/imagesgirl.png" alt="girl image">

           <div class="card">

    <div class="card-top">

            save your memories and track your mood.
            You're not alone. 💜
        </p>
    </div>

    <div class="card-middle">
        <input type="text" id="nameInput" placeholder="Enter your name">
        <button>Enter My Space ✨</button>
    </div>

    <div class="card-bottom">
        <p class="footer">Made with self love 💜</p>
    </div>

</div>

        </div>

    </div>
